services:
  - type: web
    name: alpha-trader-ai-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alpha-trader-ai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: alpha-trader-ai-redis
          property: connectionString
      - key: OWNER_API_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: AI_MODEL
        value: gpt-5-mini

  - type: keyvalue
    name: alpha-trader-ai-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: alpha-trader-ai-postgres
    plan: free
    region: singapore
